plugins { id 'com.android.application' }
android {
    namespace 'com.frozamina.triplog'
    compileSdk 35
    defaultConfig {
        applicationId 'com.frozamina.triplog'
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('versionCode') ?: '7').toInteger()
        versionName project.findProperty('versionName') ?: '1.1.5'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('TRIPLOG_KEYSTORE')) {
                storeFile file(System.getenv('TRIPLOG_KEYSTORE'))
                storePassword System.getenv('TRIPLOG_STORE_PASSWORD')
                keyAlias 'triplog'
                keyPassword System.getenv('TRIPLOG_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}

