name: Android APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Must increase for every release'
        required: true
      version_name:
        description: 'Example: 1.0.1'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.test.js
      - name: Build with permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIPLOG_KEYSTORE_BASE64 }}
          TRIPLOG_STORE_PASSWORD: ${{ secrets.TRIPLOG_STORE_PASSWORD }}
          TRIPLOG_KEY_PASSWORD: ${{ secrets.TRIPLOG_KEY_PASSWORD }}
          TRIPLOG_KEYSTORE: ${{ runner.temp }}/triplog.jks
          TRIPLOG_VERSION_CODE: ${{ inputs.version_code }}
          TRIPLOG_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$TRIPLOG_KEYSTORE"
          python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: TripLog-APK
          path: ../TripLog-*.apk
